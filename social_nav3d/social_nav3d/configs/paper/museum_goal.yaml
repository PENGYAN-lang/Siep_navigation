# Museum goal navigation config — Robot navigates from entrance to wing room
# Run: python run_demo.py --config social_nav3d/configs/paper/museum_goal.yaml \
#                         --planner proactive --siep-variant full --gpu --record --camera follow --eval

seed: 42
sim:
  dt: 0.05
  max_steps: 2500
  gui: false
  record_video: false
  camera_mode: follow    # follow | overhead | cinematic
  out_dir: runs/museum/goal
  mode: goal             # A→B goal navigation

world:
  type: museum           # triggers museum_builder instead of simple boxes
  size_xy: [30.0, 25.0]  # museum floor area

robot:
  start: [11.0, 2.0, 0.0]    # entrance hall
  goal:  [26.0, 14.0, 0.0]   # wing room center
  radius: 0.25
  height: 0.30
  max_v: 1.0
  max_w: 1.6

lidar:
  n_az: 180
  n_el: 3
  max_range: 10.0
  el_deg: [-5, 0, 5]

pedestrians:
  count: 13
  speed_range: [0.3, 1.0]   # museum visitors walk slower
  radius: 0.3
  personal_space:
    sigma_front: 1.6
    sigma_side: 0.9
    sigma_back: 0.7
  # Exhibit positions matching museum_builder.py pedestals
  waypoints:
    # Main gallery exhibits
    - [8.0,  10.0]
    - [12.0, 10.0]
    - [16.0, 10.0]
    - [10.0, 15.0]
    - [15.0, 15.0]
    # Wing room exhibits
    - [24.0, 11.0]
    - [27.0, 11.0]
    - [25.0, 16.0]
    # Entrance hall exhibits
    - [9.0,  3.0]
    - [13.0, 3.0]

planner:
  # Horizon and sampling
  horizon_steps: 20
  n_candidates: 512        # GPU: 512 (vs CPU: 80)
  plan_dt: 0.05
  uncertainty_n_samples: 32

  # GPU evaluation
  use_gpu: true
  use_cbf_humans: true

  # Objective weights
  lambda_s: 1.2            # higher social weight for goal nav (more pedestrians to avoid)
  lambda_u: 0.6            # uncertainty cost
  lambda_d: 0.3            # dynamics cost
  lambda_e: 0.0            # no exploration gain in goal mode

  # SIEP force parameters
  k_goal: 1.2              # stronger goal attraction for museum corridors
  sigma_goal: 4.0          # larger goal sigma (museum is bigger)
  k_obs: 2.5
  obs_influence: 2.5
  k_ps: 2.5
  k_align: 0.4
  k_ctx: 0.5
  k_frontier: 0.0          # no frontier in goal mode
  novelty_radius: 1.5

  # Safety barrier (CBF)
  min_clearance: 0.40
  cbf_alpha: 1.0
  cbf_jerk_limit: 0.25

  # Heading controller
  k_yaw: 2.5
  heading_slowdown: 0.5
